            '# Adminページ（ログイン） 詳細設計書\n\n## 1. ページ概要\n\n- ページ: `/admin`\n- 目的: 管理者画面（ダッシュボード）へアクセスするための認証（ログイン）を行う。\n- 対象ユーザー: 管理者\n- 関連ページ: 管理画面ダッシュボード（`/admin/dashboard`）\n\n### meta\n- `title: "To You Design - Admin"`\n\n\n## 2. 画面仕様\n\n### 画面構成図\n\n- `drawio/admin.drawio`\n\n### 画面項目\n\n画面構成は上から下へ 5 ブロックで構成する。各項目の詳細は以下のとおり。\n\n#### No1: ヘッダー\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `RootLayout` の `Header`（`components/layout/header.tsx`） |\n| 表示要素 | ロゴ（`/images/common/logo.svg`）、ハンバーガーボタン |\n\n#### No2: パンくず\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `Breadcrumb`（`components/ui/breadcrumb.tsx`） |\n| 表示階層 | トップ → Admin |\n| 操作 | トップリンククリックで `/` へ遷移。カレントページ（Admin）は `aria-current="page"`（リンクなし） |\n\n#### No3: 下層タイトル\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `LowerTitle`（`components/ui/lower-title.tsx`） |\n| 表示要素 | 見出し `Admin`（`h1`）、英字補助（`data-ja="認証"`） |\n| 背景 | 青背景（`.lower__bg`）の全幅ブロック |\n\n#### No4: ログインフォーム\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `AdminForm` (`app/(auth)/admin/admin-form.tsx`) |\n| 入力要素 | ・メールアドレス：`input[type="email"]`（必須）<br/>・パスワード：`input[type="password"]`（必須） |\n| 認証状態表示 | 現在の Cookie 状態から `auth` があれば「認証済み」、なければ「未認証」を表示（クラス `is-auth` / `is-unauth` 切り替え） |\n| 送信ボタン | `type="submit"`。送信処理中（`loading = true`）はボタンを非活性化（disabled）にし、「認証中...」とテキストを変更 |\n| エラー表示 | 認証エラー発生時、フォーム下部に赤字でエラーメッセージを表示 |\n| 操作 | サブミット時にクライアント側の `onSubmit` を経由して Server Action `authenticate` を呼び出す |\n\n#### No5: フッター\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `RootLayout` の `Footer`（全ページ共通） |\n\n## 3. データフロー\n\n- ユーザーがフォームを入力して送信ボタンを押すと、クライアント側で `loading = true` に設定し、Server Action である `authenticate(formData)` を呼び出す。\n- `authenticate` は、環境変数 `BASE_API_URL` からバックエンドのログインAPI `/api/v1/auth/login` へ POST 送信する。\n\n- **ログイン成功時**: \n  - APIからレスポンス { token: "eyJhbGci...", user: { ... } } を取得。\n  - レスポンスに含まれる JWTトークン文字列そのもの を Cookie auth_token に保存する。\n  - httpOnly: true（JavaScriptからの不正読み取り防止）\n  - secure: true（HTTPS通信のみ送信）\n  - sameSite: "lax"（CSRF対策）\n  - maxAge: 60 * 60 * 24（24時間有効）\n  - `/admin/dashboard` へのパス再検証（revalidatePath）を実行。\n  - `redirect("/admin/dashboard")` を使ってダッシュボードへ遷移させる。\n- **ログイン失敗時**:\n  - バックエンドから 401 Unauthorized 等が返却された場合、Cookieは設定せず、エラーオブジェクト `{ ok: false, error: "メールアドレスまたはパスワードが正しくありません" }` を返却。\n  - クライアント側でローディングを解除し、エラーメッセージを表示。\n\n  proxy.js\n  - **初期アクセス**: \n  - サーバーサイドで Cookie から auth_token を取得。\n  - トークンが存在する場合、バックエンドの GET /api/v1/auth/validate にリクエストしてトークンの有効性を検証。\n  - トークンがない/無効な場合: ログインフォームを表示。\n- ログイン後の各ページでも、同様に認証チェックを行い、認証されていない（トークンがない/無効）場合は /admin へリダイレクトする。\n\n### ログイン処理フロー\n\n**フロー図** (`mermaid/admin.mmd`)\n\n```mermaid\nflowchart TD\n  A["ユーザー（フォーム送信）"] --> B["onSubmit (Client Component)"]\n  B --> C["authenticate (Server Action)"]\n  C --> D["バックエンドAPI (/api/v1/auth/login)"]\n  D -- 成功 --> E["Cookieセット (auth=true)"]\n  E --> F["リダイレクト (/admin/dashboard)"]\n  D -- 失敗 --> G["エラーメッセージ返却"]\n  G --> H["画面にエラー表示"]\n```\n\n### 管理画面 画面遷移図（要認証）\n\n**画面遷移図** (`mermaid/admin-navigation.mmd`)\n\n```mermaid\n%% 管理画面 画面遷移図（要認証）\n\nflowchart TB\n  ADMIN_LOGIN["Admin ログイン<br/>/admin"]\n  DASHBOARD["ダッシュボード<br/>/admin/dashboard"]\n\n  EDIT_PF_LIST["ポートフォリオ一覧<br/>/admin/edit/portfolio"]\n  EDIT_PF_DETAIL["ポートフォリオ編集<br/>/admin/edit/portfolio/:id"]\n\n  EDIT_SKILL["スキル一覧<br/>/admin/edit/skill"]\n  EDIT_SKILL_FRONT["フロント編集<br/>/admin/edit/skill/front/:id"]\n  EDIT_SKILL_BACK["バック編集<br/>/admin/edit/skill/back/:id"]\n  EDIT_SKILL_INFRA["インフラ編集<br/>/admin/edit/skill/infra/:id"]\n  EDIT_SKILL_OTHER["その他編集<br/>/admin/edit/skill/other/:id"]\n\n  EDIT_HISTORY_LIST["経歴一覧<br/>/admin/edit/history"]\n  EDIT_HISTORY_DETAIL["経歴編集<br/>/admin/edit/history/:id"]\n\n  EDIT_JOB_LIST["職歴一覧<br/>/admin/edit/job"]\n  EDIT_JOB_DETAIL["職歴編集<br/>/admin/edit/job/:id"]\n\n  EDIT_LICENSE_LIST["資格一覧<br/>/admin/edit/license"]\n  EDIT_LICENSE_DETAIL["資格編集<br/>/admin/edit/license/:id"]\n\n  ADMIN_LOGIN -->|"認証成功<br/>Cookie: auth=true"| DASHBOARD\n  ADMIN_LOGIN -->|"認証失敗"| ADMIN_LOGIN\n\n  DASHBOARD --> EDIT_PF_LIST\n  DASHBOARD --> EDIT_SKILL\n  DASHBOARD --> EDIT_HISTORY_LIST\n  DASHBOARD --> EDIT_JOB_LIST\n  DASHBOARD --> EDIT_LICENSE_LIST\n\n  EDIT_PF_LIST --> EDIT_PF_DETAIL\n  EDIT_PF_DETAIL --> EDIT_PF_LIST\n\n  EDIT_SKILL --> EDIT_SKILL_FRONT\n  EDIT_SKILL --> EDIT_SKILL_BACK\n  EDIT_SKILL --> EDIT_SKILL_INFRA\n  EDIT_SKILL --> EDIT_SKILL_OTHER\n  EDIT_SKILL_FRONT --> EDIT_SKILL\n  EDIT_SKILL_BACK --> EDIT_SKILL\n  EDIT_SKILL_INFRA --> EDIT_SKILL\n  EDIT_SKILL_OTHER --> EDIT_SKILL\n\n  EDIT_HISTORY_LIST --> EDIT_HISTORY_DETAIL\n  EDIT_HISTORY_DETAIL --> EDIT_HISTORY_LIST\n\n  EDIT_JOB_LIST --> EDIT_JOB_DETAIL\n  EDIT_JOB_DETAIL --> EDIT_JOB_LIST\n\n  EDIT_LICENSE_LIST --> EDIT_LICENSE_DETAIL\n  EDIT_LICENSE_DETAIL --> EDIT_LICENSE_LIST\n```\n\n## 4. 状態管理・ロジック\n\n- **ローカル state (React)**:\n  - `loading`: サーバーでの認証処理実行中のローディング表示制御。\n  - `error`: バックエンド認証失敗時のエラー文言保持。\n- **Cookieによるセッション管理**:\n  - Cookie名: auth_token\n  - 値: バックエンドが発行した JWTアクセストークン\n  - 有効期限: 24時間 (maxAge: 60 * 60 * 24)\n  - セキュリティ設定:\n    - httpOnly: true (XSS対策)\n    - secure: process.env.NODE_NODE_ENV === "production" (盗聴対策)\n    - sameSite: "lax" (CSRF対策)\n    - path: "/"\n\n## 5. ルーティング\n\n- ログインページ: `/admin`\n- 成功時の遷移先: `/admin/dashboard`\n- Next.js Proxy (`proxy.js`):\n  - `/admin/dashboard` 以下のリクエストに対し、auth_token Cookieの存在を判定。\n  - トークンが存在しない場合は即座に /admin へリダイレクト。\n\n## 6. イベント・アクション仕様\n\n| イベント | 発火条件 | 処理内容 | 結果 |\n|----------|----------|----------|------|\n| ページアクセス | `/admin` にアクセス | クッキーから `auth` の有無をチェック | `auth` の状態に応じて「認証済み/未認証」の表示を切り替えてフォームを描画 |\n| フォーム送信 | フォームの送信ボタンを押下 | `onSubmit` から Server Action `authenticate` を呼び出し | 認証中表示に変更し、API通信を行う |\n| 認証成功 | APIから `200 OK` が返却 | クッキーをセットし、キャッシュを再検証 | `/admin/dashboard` にリダイレクトする |\n| 認証失敗 | APIから非成功ステータスが返却 | クライアントへエラーメッセージを返却 | ローディング表示を解除し、エラーメッセージを画面に表示する |\n\n## 7. APIインターフェース (Backend)\n\n| エンドポイント | メソッド | リクエスト | レスクッキー / レスポンス例 |\n|----------------|----------|------------|----------------------------|\n| `${process.env.BASE_API_URL}api/v1/auth/login` | POST | `{ "email": "...", "password": "..." }` | 成功: `200 OK` (Cookie用データを返却)<br/>失敗: 非成功レスポンス (例: `401 Unauthorized`) |\n\n## 8. エラーハンドリング\n\n- クライアントバリデーション：ブラウザ標準の `required` / `type="email"` による必須入力・簡易フォーマットチェック。\n- API通信エラー・認証失敗：APIが `!res.ok` の場合、共通の「メールまたはパスワードが違います」をエラーメッセージとして返し、画面に明示する。\n- ローディング制御と連動して送信ボタンを無効化し、多重送信を防ぐ。\n\n## 9. その他仕様\n\n- 実画面確認: `http://localhost:3000/admin`\n- 主要コンポーネント: `Breadcrumb`, `LowerTitle`, `CommonLabel`, `AdminForm`\n- 主要サーバーアクション: `authenticate` (`app/(auth)/admin/actions.ts`)\n',

          drawioHtml:

          mdContent:
            '# Privacy Policy 詳細設計書\n\n## 1. ページ概要\n\n- ユーザーに対して個人情報の取り扱い、アクセス解析ツール（Google Analytics, Microsoft Clarity）の使用等について明示するページ。\n- 静的生成（`export const dynamic = "force-static"`）される。\n\n### meta\n- `title: "To You Design - Privacy Policy"`\n\n## 2. 画面仕様\n\n### 画面構成図\n\n- `drawio/privacy-policy.drawio`\n\n### 画面項目\n\n画面構成は上から下へ 6 ブロックで構成する。各項目の詳細は以下のとおり。\n\n#### No1: ヘッダー\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `RootLayout` の `Header`（`components/layout/header.tsx`） |\n| 表示要素 | サイトロゴ、グローバルナビ（About / ポートフォリオ / ブログ）、お問い合わせボタン |\n| SP レイアウト | 768px 未満ではハンバーガーメニューに切り替え |\n| 操作 | ハンバーガーボタンクリックでメニュー開閉。開閉時は `body` のスクロールを禁止 |\n\n#### No2: パンくずリスト\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `Breadcrumb`（`components/ui/breadcrumb.tsx`） |\n| 表示階層 | トップ → Privacy Policy |\n| 区切り | `ChevronRight` アイコン |\n| 操作 | トップリンククリックで `/` へ遷移。ホバー時にアンダーライン表示 |\n| レイアウト | `.max_width` 内に配置 |\n\n#### No3: ヒーローエリア（Title）\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `LowerTitle`（`components/ui/lower-title.tsx`） |\n| 表示要素 | 日本語タイトル「プライバシーポリシー」、英字タイトル（`data-ja="Privacy Policy"`） |\n| 背景 | 青背景（`.lower__bg`、`#3b82f6` 系）の全幅ブロック |\n| セマンティクス | `h1.lower__title` としてページタイトルを表示 |\n\n#### No4: メインコンテンツ（本文）\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `page.tsx` 内の `.privacy-policy__content` |\n| レイアウト | `.max_width` 内に中央寄せ |\n| セクション1 | 「個人情報の利用目的」— お問い合わせ時の個人情報取り扱いについて |\n| セクション2 | 「アクセス解析ツールについて」— Google Analytics の Cookie 利用と匿名収集の説明 |\n| セクション3 | 「Microsoft Clarityについて」— ヒートマップ・セッションレコーディング等の匿名収集の説明 |\n| スタイル | 見出し: `h2.privacy-policy__heading`（太字）、本文: `p.privacy-policy__text` |\n\n#### No5: 外部リンク\n\n| 項目 | 内容 |\n|------|------|\n| 表示位置 | 各セクション本文内に配置 |\n| リンク先 | Google アナリティクス利用規約、Google ポリシーと規約、Microsoft Clarity 利用規約、Microsoft プライバシーステートメント |\n| 属性 | `target="_blank"`、`rel="noopener noreferrer"` |\n| スタイル | `a.privacy-policy__link` — 常時アンダーライン付きの青色テキスト |\n| 操作 | クリックで外部ポリシーサイトを別タブで表示 |\n\n#### No6: フッター\n\n| 項目 | 内容 |\n|------|------|\n| コンポーネント | `RootLayout` の `Footer`（全ページ共通） |\n| 表示要素 | ロゴ、サイトマップリンク、コピーライト |\n| レイアウト | ヘッダーと同様のリンク構成を画面下部に表示 |\n\n## 3. データフロー\n\n**フロー図** (`mermaid/privacy-policy.mmd`)\n\n```mermaid\nflowchart TD\n  A["ユーザーが /privacy-policy にアクセス"] --> B["静的HTMLを表示"]\n  B --> C["外部計測ツール（Google/MS）のCookie設定確認"]\n  C -- "Cookie有効時" --> D["Google Analytics / Microsoft Clarity データ収集"]\n  B --> F["ユーザーが外部リンクをクリック"]\n  F -- "target=\'_blank\'" --> G["外部利用規約サイトを別タブで表示"]\n```\n\n- 静的なコンテンツであり、外部データの動的取得はない。\n- Google Analytics および Microsoft Clarity によるクライアントサイドのデータ収集（匿名）が行われる。\n\n## 4. 状態管理・ロジック\n\n- クライアント側で Cookie を無効にされた場合、アクセス解析ツールのデータ収集は制限される（ブラウザ設定依存）。\n- モバイル表示時、ヘッダーナビゲーションはハンバーガーメニュー内に格納される。\n\n## 5. ルーティング\n\n- `/privacy-policy`\n\n## 6. イベント・アクション仕様\n\n| イベント | 発火条件 | 処理内容 | 結果 |\n|----------|----------|----------|------|\n| ページアクセス | `/privacy-policy` にアクセス | 静的HTMLのロード | プライバシーポリシーの表示 |\n| 外部リンククリック | 利用規約等のリンクをクリック | `_blank` によるリンク遷移 | 外部ポリシーサイトを別タブで表示（noopener/noreferrer付与） |\n| ハンバーガーメニュー操作 | モバイル時にメニューアイコンをクリック | ナビゲーションの開閉 | メニュー項目の表示/非表示 |\n\n## 7. APIインターフェース (Backend)\n\n- なし\n\n## 8. エラーハンドリング\n\n- 特になし。\n\n## 9. その他仕様\n\n- SEO用メタデータ: `title: "To You Design - プライバシーポリシー"`\n- コンポーネント構成: React Server Component。\n',

        MAX: 8,
      }
      function mzApply() {
        mz.canvas.style.transform = `translate(${mz.x}px, ${mz.y}px) scale(${mz.scale})`
        mz.label.textContent = Math.round(mz.scale * 100) + "%"
      }
      function mzZoomAt(newScale, cx, cy) {
        newScale = Math.min(mz.MAX, Math.max(mz.MIN, newScale))
        const k = newScale / mz.scale
        mz.x = cx - (cx - mz.x) * k
        mz.y = cy - (cy - mz.y) * k
        mz.scale = newScale
        mzApply()
      }
      function mzFit() {
        const vw = mz.stage.clientWidth,
          vh = mz.stage.clientHeight
        const cw = mz.canvas.offsetWidth,
          ch = mz.canvas.offsetHeight
        mz.fitScale = Math.min((vw * 0.94) / cw, (vh * 0.88) / ch)
        mz.scale = Math.min(mz.MAX, Math.max(mz.MIN, mz.fitScale))
        mz.x = (vw - cw * mz.scale) / 2
        mz.y = (vh - ch * mz.scale) / 2 + 20
        mzApply()
      }
      function mzOpen(srcDiv) {
        const svg = srcDiv.querySelector("svg")
        if (!svg) return
        const clone = svg.cloneNode(true)
        // 元の描画サイズ（viewBox）を等倍サイズとして採用
        const vb = (clone.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number)
        const w = vb.length === 4 && vb[2] ? vb[2] : svg.getBoundingClientRect().width
        const h = vb.length === 4 && vb[3] ? vb[3] : svg.getBoundingClientRect().height
        clone.removeAttribute("style")
        clone.setAttribute("width", w)
        clone.setAttribute("height", h)
        mz.canvas.innerHTML = ""
        mz.canvas.appendChild(clone)
        mz.overlay.classList.add("open")
        document.body.style.overflow = "hidden"
        mzFit()
      }
      function mzClose() {
        mz.overlay.classList.remove("open")
        mz.canvas.innerHTML = ""
        document.body.style.overflow = ""
      }
      // 図クリック → 拡大
      document.addEventListener("click", (e) => {
        const box = e.target.closest(".mermaid[data-zoomable]")
        if (box && !mz.overlay.contains(e.target)) mzOpen(box)
      })
      // ボタン
      document.getElementById("mz-close").addEventListener("click", mzClose)
      document
        .getElementById("mz-in")
        .addEventListener("click", () =>
          mzZoomAt(mz.scale * 1.25, mz.stage.clientWidth / 2, mz.stage.clientHeight / 2),
        )
      document
        .getElementById("mz-out")
        .addEventListener("click", () =>
          mzZoomAt(mz.scale / 1.25, mz.stage.clientWidth / 2, mz.stage.clientHeight / 2),
        )
      document.getElementById("mz-fit").addEventListener("click", mzFit)
      document.getElementById("mz-100").addEventListener("click", () => {
        const vw = mz.stage.clientWidth,
          vh = mz.stage.clientHeight
        mz.scale = 1
        mz.x = (vw - mz.canvas.offsetWidth) / 2
        mz.y = (vh - mz.canvas.offsetHeight) / 2
        mzApply()
      })
      // 背景クリックで閉じる（ドラッグ時は除く）
      let mzDown = null,
        mzMoved = false
      mz.stage.addEventListener("pointerdown", (e) => {
        mzDown = { px: e.clientX, py: e.clientY, x: mz.x, y: mz.y }
        mzMoved = false
        mz.stage.setPointerCapture(e.pointerId)
        mz.stage.classList.add("grabbing")
      })
      mz.stage.addEventListener("pointermove", (e) => {
        if (!mzDown) return
        const dx = e.clientX - mzDown.px,
          dy = e.clientY - mzDown.py
        if (Math.abs(dx) + Math.abs(dy) > 3) mzMoved = true
        mz.x = mzDown.x + dx
        mz.y = mzDown.y + dy
        mzApply()
      })
      mz.stage.addEventListener("pointerup", (e) => {
        mz.stage.classList.remove("grabbing")
        if (mzDown && !mzMoved && !mz.canvas.contains(e.target)) mzClose()
        mzDown = null
      })
      // ホイールズーム（カーソル位置中心）
      mz.stage.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault()
          const factor = Math.exp(-e.deltaY * 0.0015)
          mzZoomAt(mz.scale * factor, e.clientX, e.clientY)
        },
        { passive: false },
      )
      // ダブルクリック: フィット ⇔ 等倍(2x相当) 切替
      mz.stage.addEventListener("dblclick", (e) => {
        if (Math.abs(mz.scale - mz.fitScale) < 0.02)
          mzZoomAt(Math.max(1, mz.fitScale * 2), e.clientX, e.clientY)
        else mzFit()
      })
      // キーボード
      document.addEventListener("keydown", (e) => {
        if (!mz.overlay.classList.contains("open")) return
        const cx = mz.stage.clientWidth / 2,
          cy = mz.stage.clientHeight / 2
        if (e.key === "Escape") mzClose()
        else if (e.key === "+" || e.key === "=") mzZoomAt(mz.scale * 1.25, cx, cy)
        else if (e.key === "-") mzZoomAt(mz.scale / 1.25, cx, cy)
        else if (e.key === "0") mzFit()
        else if (e.key === "1") document.getElementById("mz-100").click()
      })
      window.addEventListener("resize", () => {
        if (mz.overlay.classList.contains("open")) mzFit()
      })

      async function renderView(key) {
        const item = data[key]
        if (!item) return
        document.getElementById("drawio-title").textContent = item.drawioTitle
        document.getElementById("md-title").textContent = item.mdTitle
        document.getElementById("drawio-container").innerHTML = item.drawioHtml

        const mdContainer = document.getElementById("md-container")
        mdContainer.innerHTML = marked.parse(item.mdContent)

        // Mermaid ダイアグラムの自動レンダリング（ブロックごとに独立して描画）
        await renderMermaidBlocks(mdContainer)

        // スクロール位置を一番上へリセット
        document.getElementById("drawio-container").scrollTop = 0
        document.getElementById("md-container").scrollTop = 0
      }

      // タブ切り替え関数
      function switchToTab(key) {
        if (!data[key]) return
        const targetTab = document.querySelector(`.ss-tab[data-target="${key}"]`)
        if (targetTab) {
          document.querySelectorAll(".ss-tab").forEach((t) => t.classList.remove("active"))
          targetTab.classList.add("active")
          renderView(key)
          targetTab.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" })
        }
      }

      // タブバークリック処理
      document.querySelectorAll(".ss-tab").forEach((tab) => {
        tab.addEventListener("click", (e) => {
          switchToTab(e.currentTarget.dataset.target)
        })
      })

      // 画面内リンク（Markdownや構成図の [data-tab]）クリック時のタブ切り替え処理
      document.addEventListener("click", (e) => {
        const trigger = e.target.closest("[data-tab]")
        if (trigger && !trigger.classList.contains("ss-tab")) {
          e.preventDefault()
          const target = trigger.getAttribute("data-tab")
          if (target && data[target]) {
            switchToTab(target)
          }
        }
      })

      // 初期表示 (最初にREADMEタブを表示)
      renderView("readme")

      // 左右ペインのリサイズ用スプリッター機能
      const splitter = document.getElementById("splitter")
      const paneLeft = document.getElementById("pane-left")
      const previewContainer = document.getElementById("preview-container")
      let isDragging = false

      splitter.addEventListener("mousedown", (e) => {
        isDragging = true
        splitter.classList.add("dragging")
        e.preventDefault()
      })

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return
        const containerRect = previewContainer.getBoundingClientRect()
        const offsetX = e.clientX - containerRect.left
        const totalWidth = containerRect.width

        let percentage = (offsetX / totalWidth) * 100
        if (percentage < 15) percentage = 15
        if (percentage > 85) percentage = 85

        paneLeft.style.width = percentage + "%"
      })

      window.addEventListener("mouseup", () => {
        if (isDragging) {
          isDragging = false
          splitter.classList.remove("dragging")
        }
      })

      // 全画面表示切り替え
      const fsBtn = document.getElementById("fs-btn")
      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch((err) => {
            alert("全画面表示のエラー: " + err.message)
          })
          fsBtn.textContent = "全画面解除"
        } else {
          document.exitFullscreen()
          fsBtn.textContent = "全画面表示"
        }
      })
    </script>
  </body>
</html>
