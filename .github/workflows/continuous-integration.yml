name: nextjs-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 共通の実行環境定義
defaults:
  run:
    shell: bash

jobs:
  # ----------------------------------------------------
  # 1. Format チェック（最軽量・高速）
  # ----------------------------------------------------
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format code
        run: pnpm format:check

  # ----------------------------------------------------
  # 2. Lint チェック
  # ----------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint code
        run: pnpm lint

  # ----------------------------------------------------
  # 3. React Doctor 実行（重めの処理）
  # ----------------------------------------------------
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 診断とスコア取得を1回にまとめて高速化
      - name: Run React Doctor
        run: |
          npx -y react-doctor@latest . --verbose
          SCORE=$(npx -y react-doctor@latest . --score 2>/dev/null || echo "0")
          echo "React Doctor Health Score: $SCORE"
        continue-on-error: true
